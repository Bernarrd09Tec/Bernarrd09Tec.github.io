<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz da Austrália 🇦🇺</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background: linear-gradient(135deg,#012169,#0057b8);
    color:white;
    text-align:center;
}

.container{
    max-width:700px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    color:#222;
    border-radius:20px;
    padding:25px;
    margin-top:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.3);
    animation:fade .5s;
}

button{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    transition:.3s;
}

.option{
    background:#e8e8e8;
}

.option:hover{
    transform:scale(1.03);
    background:#d5e8ff;
}

.start{
    background:#ffcc00;
    font-weight:bold;
}

.progress{
    width:100%;
    background:#ddd;
    height:10px;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:15px;
}

.bar{
    height:100%;
    background:#00c853;
    width:0%;
    transition:.5s;
}

.hidden{
    display:none;
}

@keyframes fade{
    from{opacity:0; transform:translateY(15px);}
    to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="container">

<div id="welcome" class="card">
<h1>🇦🇺 Bem-vindo ao Grupo da Austrália!</h1>

<p>
Você está visitando nosso estande na Feira Cultural.
Teste seus conhecimentos sobre a Austrália e descubra curiosidades incríveis!
</p>

<p><strong>🦘 Curiosidade:</strong><br>
A Austrália possui mais de 10 mil praias!
</p>

<button class="start" onclick="startQuiz()">
COMEÇAR QUIZ
</button>
</div>

<div id="quiz" class="card hidden">
<div class="progress">
<div id="bar" class="bar"></div>
</div>

<h2 id="question"></h2>

<div id="answers"></div>
</div>

<div id="result" class="card hidden"></div>

</div>

<script>

const questions = [

{
q:"Qual é a capital da Austrália?",
a:["Sydney","Melbourne","Canberra","Perth"],
c:2
},

{
q:"Qual animal é símbolo da Austrália?",
a:["Panda","Canguru","Tigre","Lhama"],
c:1
},

{
q:"Qual famosa construção fica em Sydney?",
a:["Torre Eiffel","Opera House","Big Ben","Coliseu"],
c:1
},

{
q:"Qual é a língua mais utilizada na Austrália?",
a:["Francês","Espanhol","Inglês","Italiano"],
c:2
},

{
q:"Em qual hemisfério fica a Austrália?",
a:["Norte","Sul","Leste","Ártico"],
c:1
},

{
q:"Qual desses animais vive na Austrália?",
a:["Ornitorrinco","Urso Polar","Lobo","Panda"],
c:0
},

{
q:"Qual é a maior barreira de corais do mundo?",
a:["Grande Barreira de Corais","Barreira Azul","Recife Tropical","Coral Gigante"],
c:0
},

{
q:"Qual esporte é muito popular na Austrália?",
a:["Sumô","Futebol Australiano","Críquete de Gelo","Polo"],
c:1
},

{
q:"A Austrália é considerada:",
a:["Cidade","Continente e País","Estado","Ilha pequena"],
c:1
},

{
q:"Qual ave aparece no brasão australiano junto com o canguru?",
a:["Águia","Papagaio","Ema","Coruja"],
c:2
}

];

let current=0;
let score=0;

function startQuiz(){
document.getElementById("welcome").classList.add("hidden");
document.getElementById("quiz").classList.remove("hidden");
showQuestion();
}

function showQuestion(){

let q=questions[current];

document.getElementById("question").innerText=
(current+1)+"/"+questions.length+" - "+q.q;

let answers=document.getElementById("answers");
answers.innerHTML="";

q.a.forEach((option,index)=>{

let btn=document.createElement("button");

btn.className="option";
btn.innerText=option;

btn.onclick=()=>checkAnswer(index);

answers.appendChild(btn);

});

document.getElementById("bar").style.width=
((current/questions.length)*100)+"%";

}

function checkAnswer(answer){

if(answer===questions[current].c){
score++;
}

current++;

if(current<questions.length){
showQuestion();
}else{
finishQuiz();
}

}

function finishQuiz(){

document.getElementById("quiz").classList.add("hidden");

let msg="";

if(score<=4){
msg="🦘 Explorador da Austrália";
}
else if(score<=8){
msg="🇦🇺 Conhecedor da Austrália";
}
else{
msg="🏆 Especialista em Austrália!";
}

document.getElementById("result").classList.remove("hidden");

document.getElementById("result").innerHTML=
`
<h1>${msg}</h1>

<h2>Você acertou ${score} de ${questions.length}</h2>

<p>
Obrigado por visitar o Grupo da Austrália!
Esperamos que você tenha aprendido um pouco mais sobre a cultura,
os animais e as curiosidades desse país incrível.
</p>

<button class="start" onclick="location.reload()">
JOGAR NOVAMENTE
</button>
`;

}

</script>

</body>
</html>
